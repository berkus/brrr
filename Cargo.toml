[package]
authors = ["Berkus Decker <berkus+cargo@metta.systems>"]
edition = "2024"
name = "brrr"
version = "0.0.3"
resolver = "2"
publish = false

[dependencies]
brrr_derive = { path = "./brrr_derive" }
anyhow = "1.0"
thiserror = "1.0"
culpa = "1.0"
# Release
bevy = "0.13"
# Debug
# bevy = { version = "0.13", features = ["dynamic_linking"] }
# bevy_egui = "0.26"
# bevy-inspector-egui = { version = "0.23", features = ["highlight_changes"] }
# egui = "0.27"
bevy_asset_loader = "0.20"
smooth-bevy-cameras = "0.11"
byteorder = "1.5"
log = "0.4"
image = "0.25"                                            # for png encoder
cgmath = "0.18"
num = "0.4"
fern = "0.6"
chrono = "0.4"
rgb = "0.8.37"
imgref = { version = "1.10.1", default-features = false }

[features]
default = ["fastdev"]
fastdev = ["bevy/dynamic_linking"]

[dev-dependencies]
png = "0.17"

[lib]
name = "brrr"

[[bin]]
name = "brrr"

[[bin]]
name = "convert_to_png"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
